.env_defaults: &elift_env
  NODES: 4
  SKU: 141G8-H200-IB-NvLink
  sla_tier: premium
  TARGET: spch-train-h200-safn
  IMAGE: speechllm:megratron-latest

.config: &elift_config
  target:
    service: sing
    name: ${TARGET}
    workspace_name: speech-training-prod-ws01
  environment:
    registry: speechllmregistry.azurecr.io
    image: ${IMAGE}
  storage:
    output:
      storage_account_name: tsstd01safn
      container_name: amulet
    model_blob:
      storage_account_name: tsstd01safn
      container_name: data
      mount_dir: /modelblob
    data_blob:
      storage_account_name: highperf01safn
      container_name: data
      mount_dir: /datablob1
  code: &elift_code
    local_dir: $CONFIG_DIR/../../..
    ignore:
      - __pycache__/
      - "*.pyc"

.job: &elift_job
  sku: ${NODES}x${SKU}
  sla_tier: ${sla_tier}
  priority: high
  mpi: true
  process_count_per_node: 8
  submit_args:
    container_args:
      SHARED_MEMORY_PERCENT: 0.5
    env:
      NCCL_DEBUG: INFO
      _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/f0d830dc-9b44-446e-86dd-722e7de7c533/resourceGroups/speech-training-h200/providers/Microsoft.ManagedIdentity/userAssignedIdentities/speech-training-uai-safn
      UAI_CLIENT_ID: 68a1b0af-8c4e-49e7-86fb-8b0e8a86d59a
  identity: managed
