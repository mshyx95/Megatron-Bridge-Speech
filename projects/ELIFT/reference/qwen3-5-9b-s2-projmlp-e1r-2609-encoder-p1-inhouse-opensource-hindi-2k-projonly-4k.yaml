    local_conv_use_glu: true
    mask_frontend_padding: true
    num_attention_heads: 20
    num_hidden_layers: 23
    num_key_value_heads: 10
    rms_norm_eps: 1.0e-06
    rope_theta: 1000000.0
    sliding_window: 500
    use_fused_kernels: true
    use_local_conv: true
  name: flash
  init_model:
    pretrained_speech_encoder_path: /datablob1/users/yuxuanhu/models/azure_asr/speech_encoder/2609/fast-llm-2609-qwen9b-flashenc-mtp-s2-data-v3.5.4-r2_RL2/400/model.checkpoint
