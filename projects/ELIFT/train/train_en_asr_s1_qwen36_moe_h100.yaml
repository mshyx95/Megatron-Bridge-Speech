# Full Qwen3.6-35B-A3B stage-1 EN-ASR training on 80GB H100 GPUs. Full recompute retains the
# memory-feasible execution policy validated by the 8-GPU smoke run.

freeze_language_model: true
activation_recompute: true

tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
sequence_parallel: false
expert_model_parallel_size: 8
expert_tensor_parallel_size: 1
global_batch_size: 64
micro_batch_size: 1
seq_length: 8192

streaming_num_workers: 1
streaming_prefetch_factor: 16
timing_log_level: 2

train_iters: 12000
save_interval: 2000
lr: 1.0e-4
lr_warmup_iters: 100
log_interval: 10