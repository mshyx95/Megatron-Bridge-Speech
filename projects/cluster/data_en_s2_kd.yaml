#
# Legacy ASR-sourced mixture: audio-response/continuation entries below do not supply
# separate rewrite transcripts. Strict template KD now rejects those missing-transcript
# samples; use data_s2tt_b1.yaml for the reference rewrite training mixture.
# The historical response-derived teacher description below is not the current streaming path.
# Stage-2 speech->text knowledge-distillation (KD) streaming data config, consumed by
# SpeechChunkStreamingDatasetProvider / build_speech_chunk_dataset. Mirrors the reference phyagi S2
# mixture that the MTP4-KD run trains on
# (cascade_encoder_stage2/qwen3-5-4b-s2-projonly-lfg3-p1-mtp4-4k.yaml -> the base config the
# `-proj20m-p1-mtp4-kd-{warm500,full4000}` overrides inherit from). Four categories matching the
# reference base group counts (ASR 5 : ast-cot 2 : nothink 5 : continuation 5). The ASR / nothink /
# continuation categories are all built from the SAME five ASR spec-groups (in-house + earnings,
# multilingual in-house, MLS/GigaSpeech, CommonVoice/VoxPopuli/FLEURS, OpenASR AMI/earnings),
# differing only by prompt formatter:
#   - ASR            (prompt_formatter asr / asr-lexical): user asks to transcribe, response = transcript.
#   - nothink        (prompt_formatter audio-response):    user turn is bare `<audio>`, response = transcript.
#   - continuation   (prompt_formatter audio-continuation): user turn is `{prompt}\n\n<audio>`, response = transcript.
#   - speech-transl. (prompt_formatter ast-cot, 2 groups): response = `{transcript}<sep>{translation}`;
#                    the teacher keeps only the pre-`<sep>` source transcript.
#
# KD teacher alignment: for ASR / nothink / continuation the supervised assistant response IS the
# reference transcript (ASR-sourced specs; the plain audio-response / audio-continuation formatters do
# not carry a separate answer), so the response label tokens are exactly the transcript tokens the
# teacher path needs to replace each audio placeholder span. For ast-cot the response is
# `{transcript}<sep>{translation}`, so the collator passes the tokenized `<sep>` marker to
# `derive_transcript_ids`, which truncates each response run at the first `<sep>` to keep only the
# source transcript. The teacher build reads a per-example `transcript_ids` field
# (Sequence[torch.Tensor], one 1D long tensor per audio segment k, ordered to match the `-(k+1)`
# placeholder runs in `input_ids`); when it is absent the dynamic collator derives it from the response
# labels (`derive_transcript_ids`). The collator emits `teacher_input_ids` /
# `teacher_labels` / `teacher_attention_mask` when `knowledge_distillation` is set below.
#
# Reads the mounted /datablob1 (use_storage_api: False; pass --streaming-force-local for local runs).

data_audio_processor:
  name: "cascades"

seq_len: 8192
compression_rate: 8
downsample_rate: 1
batcher_batch_size: ${seq_len}

use_storage_api: False
multi_threaded_download: True
prefetch_queue_size: 48
conv_template: qwen3_audio_instruct
padding_mask: True
streaming_compression: True

tokenizer:
  pretrained_model_name_or_path: /datablob1/users/ruchaofan/Phi-omni-checkpoints/language_ckpt/Qwen3.5-4B/

pad_to_context_length: False

