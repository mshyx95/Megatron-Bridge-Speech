#
# Real English-ASR streaming data config for stage-1 (encoder + projector) training, consumed by
# SpeechChunkStreamingDatasetProvider. Mirrors the production DeepSpeed data spec
# (qwen3-5-4b-en-asr-2605-s1-projmlp.yaml) exactly: 3 dataset groups — (1) in-house EN + earnings,
# (2) MLS-en 2k + GigaSpeech 2.5k (asr-lexical, lowercased), (3) CommonVoice15-en + VoxPopuli-en.
# Reads the mounted /datablob1 (use_storage_api: False).

seq_len: 8192
compression_rate: 8
downsample_rate: 1
batcher_batch_size: 8192

use_storage_api: False
multi_threaded_download: True
prefetch_queue_size: 128
conv_template: qwen3_audio_instruct
padding_mask: True
streaming_compression: True

data_audio_processor:
  name: cascades

tokenizer:
  pretrained_model_name_or_path: ${oc.env:SPEECH_TOKENIZER_PATH}

dataset:
  - dataset_spec:
      - /datablob1/users/ruchaofan/DataSpecs/mlang_s2/asr_person_filtered/asr_chunk_inhouse_en.json
      - /datablob1/users/ruchaofan/DataSpecs/mlang_s2/asr_person_filtered/asr_chunk_earnings.json
    use_num_examples_as_durations: True
    filter_options:
      max_utterance_frames: 4000
      min_utterance_frames: 50
      max_utterance_labels: 200
      min_utterance_labels: 3
      remove_utterance_by_wer: true
      remove_utterance_by_ctc_length: true
      ctc_filter_subsampling_factor: 8
      illegal_char_filter: true
    transform_cls:
      name: AudioTextConversationTransform
      conv_template: ${conv_template}
      prompt_formatter: asr
      fixed_prompt: False
      batch_format: "samples_to_sequence"
    use_storage_api: ${use_storage_api}
    multi_threaded_download: ${multi_threaded_download}
    prefetch_queue_size: ${prefetch_queue_size}
    compression_rate: ${compression_rate}
    streaming_compression: ${streaming_compression}
    qformer_compression_rate: ${downsample_rate}
    seq_len: ${seq_len}
    batcher_buffer_size: 1000
    batcher_batch_size: ${batcher_batch_size}
    num_chunks_for_shuffling: 10
    weight: 1.0
    tokenizer: ${tokenizer}
    audio_processor: ${data_audio_processor}
    pad_to_context_length: False
    dataset_provider: blob_chunk_alm

  # Open-source English ASR: MLS-en (~2kh) + GigaSpeech (2.5kh); lexical prompt + lowercase.
  - dataset_spec:
      - /datablob1/users/ruchaofan/DataSpecs/mlang_s2/asr_person_filtered/open_mls_en_asr_2k.json
      - /datablob1/users/ruchaofan/DataSpecs/mlang_s2/asr_person_filtered/asr_chunk_gigaspeech_2k5.json
    use_num_examples_as_durations: True
    filter_options:
      max_utterance_frames: 3000
      min_utterance_frames: 50
      max_utterance_labels: 400
      min_utterance_labels: 3
    transform_cls:
      name: AudioTextConversationTransform
      conv_template: ${conv_template}
      prompt_formatter: asr-lexical
      fixed_prompt: False
      batch_format: "samples_to_sequence"
    text_normalization:
      case_normalize: "lower"
    use_storage_api: ${use_storage_api}
    multi_threaded_download: ${multi_threaded_download}
    prefetch_queue_size: ${prefetch_queue_size}
    compression_rate: ${compression_rate}
    streaming_compression: ${streaming_compression}
    qformer_compression_rate: ${downsample_rate}
    seq_len: ${seq_len}
    batcher_buffer_size: 1000
    batcher_batch_size: ${batcher_batch_size}
    num_chunks_for_shuffling: 10
    weight: 1.0
    tokenizer: ${tokenizer}
    audio_processor: ${data_audio_processor}
    pad_to_context_length: False
    dataset_provider: blob_chunk_alm

  # Open-source English ASR: CommonVoice15-en (1.07M) + VoxPopuli-en (0.18M).
  - dataset_spec:
      - /datablob1/users/ruchaofan/DataSpecs/mlang_s2/asr_person_filtered/asr_chunk_cv15_en.json
      - /datablob1/users/ruchaofan/DataSpecs/mlang_s2/asr_person_filtered/asr_chunk_voxpopuli_en.json
    use_num_examples_as_durations: True
    filter_options:
      max_utterance_frames: 3000
      min_utterance_frames: 50
      max_utterance_labels: 800
      min_utterance_labels: 3
    transform_cls:
      name: AudioTextConversationTransform
      conv_template: ${conv_template}
      prompt_formatter: asr
      fixed_prompt: False
      batch_format: "samples_to_sequence"
    use_storage_api: ${use_storage_api}
    multi_threaded_download: ${multi_threaded_download}
    prefetch_queue_size: ${prefetch_queue_size}
    compression_rate: ${compression_rate}
    streaming_compression: ${streaming_compression}
    qformer_compression_rate: ${downsample_rate}
    seq_len: ${seq_len}
    batcher_buffer_size: 1000
    batcher_batch_size: ${batcher_batch_size}
    num_chunks_for_shuffling: 10
    weight: 1.0
    tokenizer: ${tokenizer}
    audio_processor: ${data_audio_processor}
    pad_to_context_length: False
    dataset_provider: blob_chunk_alm

dataset_concat: random_iterable
dataset_provider: blob_chunk_alm
dataset_collator:
  cls: blob_chunk_alm_dynamic
  tokenizer: ${tokenizer}
  audio_key: inputs_embeds
  padding_mask: ${padding_mask}
