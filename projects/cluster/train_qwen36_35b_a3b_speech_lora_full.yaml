# Qwen3.6-35B-A3B Speech Cascades LoRA on the stage-1 EN-ASR data. Shared paths retain rank 320 and
# alpha 640, while routed-expert adapters use rank 40 and effective alpha 80 to preserve scaling=2.
# Routed-expert adapters are shared across experts and EP ranks.
# The 16-GPU mesh has dense DP=16 and expert DP=2.
freeze_language_model: false
freeze_audio_model: false
activation_recompute: true
attention_backend: flash

tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
sequence_parallel: false
expert_model_parallel_size: 8
expert_tensor_parallel_size: 1
global_batch_size: 64
micro_batch_size: 1
seq_length: 8192

lora_rank: 320
lora_alpha: 640
lora_dropout: 0.01
normalize_moe_lora: true
per_expert_lora: false

# w1/p16 was sufficient in the matched dataloader A/B; consumer wait remained below 0.1%.
streaming_num_workers: 1
streaming_prefetch_factor: 16
train_iters: 12000
save_interval: 2000
lr: 2.0e-5
lr_warmup_iters: 100
log_interval: 10
timing_log_level: 1