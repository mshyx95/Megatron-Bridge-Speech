description: Qwen3.6-35B-A3B Speech Cascades 12K-step GBS64 rank-320 normalized MoE LoRA on EN-ASR data (16 H100)

<<: !include .speech-vc02.local.yaml

env_defaults:
  <<: *speech_vc02_env
  JOB_NAME: qwen36-35b-a3b-speech-lora-r320-e40-en-asr-12k-gbs64-16gpu-scale-fix
  BASE_HF: *qwen36_base_hf
  MODEL_HF: *qwen36_model_hf
  PRETRAINED_CHECKPOINT: *qwen36_checkpoint
  OUTPUT: *qwen36_lora_output
  TRAIN_CONFIG: projects/cluster/train_qwen36_35b_a3b_speech_lora_full.yaml
  DATA_CONFIG: projects/cluster/data_en_asr_s1.yaml

jobs:
  - <<: *speech_vc02_job
    name: ${JOB_NAME}
    sku: ${NODES}x${SKU}
    sla_tier: ${sla_tier}
    priority: low
    command:
      - nvidia-smi
      - export BASE_HF=${BASE_HF}
      - export ENC_CKPT=${ENC_CKPT}
      - export MODEL_HF=${MODEL_HF}
      - export PRETRAINED_CHECKPOINT=${PRETRAINED_CHECKPOINT}
      - export OUTPUT=${OUTPUT}
      - export TRAIN_CONFIG=${TRAIN_CONFIG}
      - export DATA_CONFIG=${DATA_CONFIG}
      - export USE_PEFT=1
      - bash projects/cluster/run_speech_cascades_stage1.sh