# Native Megatron-Bridge ELIFT stage training on 32 H200 GPUs (replaces the DeepSpeed ds_train_advanced.py jobs).
# Submit one stage at a time from the repository root:
#   STAGE=p4 amlt run projects/cluster/amlt_elift_h200.yaml elift-p4 -d "ELIFT P4"
# Stages: b1 b2 b3 b4 c e1r e1r-hindi-2k p2 p3 p4 p5 p6 p4-hindi-2k new-tier1-hindi-2k-e1r new-tier1-hindi-5k-e1r-8k.
# Continuation stages (p2, p4, p5, p6, p4-hindi-2k) need init_checkpoints.<stage> set in
# projects/cluster/elift/v0.1/launch.yaml. Check a stage first with:
#   python examples/models/speech_cascades/launch_elift_stage.py --stage p4 --dry-run

description: ELIFT native Megatron-Bridge training on 32 H200 GPUs

env_defaults:
  STAGE: b2
  NODES: 4
  SKU: 141G8-H200-IB-NvLink
  sla_tier: premium
  TARGET: spch-train-h200-safn
  IMAGE: speechllm:megratron-latest

target:
  service: sing
  name: ${TARGET}
  workspace_name: speech-training-prod-ws01

environment:
  registry: speechllmregistry.azurecr.io
  image: ${IMAGE}

storage:
  output:
    storage_account_name: tsstd01safn
    container_name: amulet
  model_blob:
    storage_account_name: tsstd01safn
    container_name: data
    mount_dir: /modelblob
  data_blob:
    storage_account_name: highperf01safn
    container_name: data
    mount_dir: /datablob1

code:
  local_dir: $CONFIG_DIR/../..
  ignore:
    - __pycache__/
    - "*.pyc"

jobs:
  - name: elift-${STAGE}-native
    sku: ${NODES}x${SKU}
    sla_tier: ${sla_tier}
    priority: high
    mpi: true
    process_count_per_node: 8
    command:
      - set -e -o xtrace
      - nvidia-smi
      - export PYTHONPATH=$$(pwd)/src:$$(pwd)/3rdparty/Megatron-LM
      - export PYTHONUNBUFFERED=1 CUDA_DEVICE_MAX_CONNECTIONS=1 NCCL_P2P_LEVEL=NVL
      - export TORCH_NCCL_BLOCKING_WAIT_TIMEOUT=1800 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - uv run --no-project --python "$$(command -v python)" python examples/models/speech_cascades/launch_elift_stage.py --stage ${STAGE}
    submit_args:
      container_args:
        SHARED_MEMORY_PERCENT: 0.5
      env:
        NCCL_DEBUG: INFO
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/f0d830dc-9b44-446e-86dd-722e7de7c533/resourceGroups/speech-training-h200/providers/Microsoft.ManagedIdentity/userAssignedIdentities/speech-training-uai-safn
        UAI_CLIENT_ID: 68a1b0af-8c4e-49e7-86fb-8b0e8a86d59a
    identity: managed
