dataset_concat: random_iterable
dataset_provider: blob_chunk_alm
dataset_collator:
  cls: blob_chunk_alm_dynamic
  tokenizer: ${tokenizer}
  audio_key: inputs_embeds
  padding_mask: ${padding_mask}
audio_tower:
  name: cascades
  config:
    input_size: 80
    attention_dim: 1024
    attention_heads: 16
    linear_units: 1536
    dropout_rate: 0.0
    num_blocks: 23
    kernel_size: 3
    causal: true
    batch_norm: false
    activation: swish
    conv_activation: swish
    conv_glu_type: swish
    cnn_layer_norm: true
    depthwise_seperable_out_channel: 1024
    depthwise_multiplier: 1
    ext_pw_out_channel: 1024
    ext_pw_kernel_size: 1
    chunk_size: -1
    left_chunk: 18
    bias_in_glu: true
    input_layer: nemo_conv
    time_reduction: 8
    nemo_conv_settings:
      conv_channels: 1024
    relative_attention_bias_args:
      type: t5
      t5_bias_max_distance: 500
    activation_checkpointing:
      module: transformer
      interval: 1
      offload: false
    encoder_embedding_config:
      input_size: 80
    use_flashattention_t5bias: true
  init_model:
    pretrained_speech_encoder_path: ${oc.env:SPEECH_ENCODER_CHECKPOINT}
    mean_file: ${oc.env:SPEECH_ENCODER_MEAN}
    invstd_file: ${oc.env:SPEECH_ENCODER_INVSTD}
model:
  pretrained_model_name_or_path: ${oc.env:SPEECH_TOKENIZER_PATH}
  model_type: qwen3_5_audio_instruct
  trust_remote_code: true
  embd_layer:
    embedding_cls: audio
    projection_cls: lfg3
    projector_hidden: 4096
    compression_rate: ${compression_rate}
    enable_gradient_checkpointing: true
    use_qformer: false
  _attn_implementation: flash_attention_2
  audio_processor: ${audio_tower}
  use_fused_kernels: true
  use_fused_dense: false
  gradient_checkpointing: true
  knowledge_distillation: true
  distillation_temperature: 2.0
  distillation_kl_chunk_size: 128
  customized_params_conf:
    FREEZE_PATTERNS:
    - model.layers
    - model.norm
    - lm_head
    - model.embed_tokens.weight
    - model.embed_tokens_extend.encoder
training_args:
  ds_config:
    bf16:
      enabled: true
    optimizer:
      type: Adam
      params:
        lr: 0.0001
        betas:
        - 0.9
        - 0.95
        eps: 1.0e-07
        weight_decay: 0.01
        adam_w_mode: true
    scheduler:
      type: WarmupDecayLR
      params:
        warmup_min_lr: 0
        warmup_max_lr: 0.0001
        warmup_type: linear
        warmup_num_steps: 100
    zero_optimization:
      stage: 1
      overlap_comm: true
      reduce_bucket_size: 500000000.0
    gradient_clipping: 1.0
    steps_per_print: 10000000000
    train_batch_size: 512
    train_micro_batch_size_per_gpu: 1
    wall_clock_breakdown: true
    zero_allow_untested_optimizer: true
    initial_dynamic_scale: 4096
  do_final_eval: false
  num_train_epochs: 1
  max_steps: 4000
  logging_steps: 10
  save_steps: 400
  save_last_n_checkpoints: 10
  save_last_n_steps: 400
  save_final_checkpoint: true
  seed: 1234
  eval_steps: 1000
  eval_max_steps: 1000
  pipe_parallel_size: 0
  tensor_parallel_size: 0
  dataloader_shuffle: true
  mlflow: true
  wandb: true
  dataloader_prefetch_factor: 512
  dataloader_num_workers: 1
  iterable_dataloader_prefetch_factor: 128
  iterable_dataloader_pin_memory: true
  batch_tracker: true
  timeout: 7200
