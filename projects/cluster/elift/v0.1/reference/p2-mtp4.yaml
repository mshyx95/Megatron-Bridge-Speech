description: >-
  Corrected P2: native Qwen3.5-9B plus checkpoint-22L encoder and MLP,
  with ExpandedMTP4. Load native layer 0, copy-initialize independent
  layers 1-3 and train all four independently. Do not resume the excluded
  one-layer P2 run. Preserve full inhouse plus open-source data, inherited
  1:1:1 mixture and auxiliary AST, main KLD, MTP auxiliary CE weight 0.1,
  frozen backbone/encoder, trainable MLP and MTP, LR 1e-4 and 4000 steps.
  Depth weights [0.30, 0.25, 0.25, 0.20] match corrected P4/P5.
output_dir: /modelblob/projects/product-train-p2-expanded-mtp4-20260912/amlt-results/p2-qwen35-9b-22l-mlp-expanded-mtp4-full-4k
model:
  model_type: qwen3_5_mtp_audio_instruct
  mtp_num_hidden_layers: 4
  mtp_loss_depth_weights: [0.30, 0.25, 0.25, 0.20]
  mtp_init_extra_layers_from_first: true
  mtp_loss_weight: 0.1
  mtp_distillation_weight: 0.0
  use_fused_kernels: false
  knowledge_distillation: true
  customized_params_conf:
    FREEZE_PATTERNS:
    - model.layers
    - model.norm
    - lm_head
    - model.embed_tokens.weight
    - model.embed_tokens_extend.encoder
training_args:
  ds_config:
    optimizer:
      params:
        lr: 1.0e-4
    scheduler:
      params:
        warmup_max_lr: 1.0e-4
    train_micro_batch_size_per_gpu: 1
    train_batch_size: 512
  max_steps: 4000