#
# HuggingFace Open-ASR-Leaderboard WER eval of a native Megatron-Bridge speech-cascades checkpoint
# on Singularity (aiservices-vc02-eu2 / eus2). Mirrors production run_opensr_eval.sh "openasr":
# librispeech-clean/other, earnings22, spgispeech, ami, gigaspeech (ESB test parquets), data-parallel
# across 8 GPUs on one node. WER via whisper EnglishTextNormalizer + word edit distance.

description: yuxuanhu_s2s_qwen bridge 4B EN-ASR s1 OpenASR-leaderboard WER eval (VC02)

env_defaults:
  NODES: 1
  SKU: 80G8-H100-IB-NvLink
  sla_tier: standard
  TARGET: aiservices-vc02-eu2
  IMAGE: jing-dev:mega_0812-bridge-v0.5.1-train
  JOB_NAME: qwen3-5-4b-en-asr-s1-openasr
  OUTPUT: /modelblob/projects/yuxuanhu_s2s_qwen/bridge-results/en-asr-s1-v3-prodmatch
  CHECKPOINT_ITER: 12000

target:
  service: sing
  name: ${TARGET}
  workspace_name: aiservices-prod-ws02-eus2

environment:
  registry: speechllmregistry.azurecr.io
  image: ${IMAGE}

storage:
  output:
    storage_account_name: tsstd01eus2
    container_name: amulet
  model_blob:
    storage_account_name: tsstd01eus2
    container_name: data
    mount_dir: /modelblob
  data_blob:
    storage_account_name: highperf01eus2
    container_name: data
    mount_dir: /datablob1

code:
  local_dir: $CONFIG_DIR/../..

jobs:
  - name: ${JOB_NAME}
    sku: ${NODES}x${SKU}
    sla_tier: ${sla_tier}
    priority: high
    mpi: True
    process_count_per_node: 8
    command:
      - nvidia-smi
      - export OUTPUT=${OUTPUT}
      - export CHECKPOINT_ITER=${CHECKPOINT_ITER}
      - bash projects/cluster/run_speech_cascades_openasr.sh
    submit_args:
      container_args:
        SHARED_MEMORY_PERCENT: 0.5
      env:
        NCCL_DEBUG: "INFO"
        _AZUREML_SINGULARITY_JOB_UAI: aiservices-training-c02-uai-eus2
    identity: managed
